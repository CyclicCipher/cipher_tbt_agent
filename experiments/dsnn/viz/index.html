<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuron Lab</title>
<style>
  :root {
    --bg: #0e1117; --panel: #151a23; --scope: #0a0d13; --line: #262d3a; --text: #d8dee9; --muted: #8a94a6;
    --accent: #ffa94d; --accent2: #4dabf7; --good: #69db7c; --bad: #ff6b6b; --chip: #1e2532;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { background: var(--chip); border: 1px solid var(--line); color: var(--text); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .tab.on { border-color: var(--accent); color: var(--accent); }
  .question { padding: 10px 16px; color: var(--text); border-bottom: 1px solid var(--line); background: var(--panel); font-size: 13.5px; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 40%) 1fr; }
  .left { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .right { overflow-y: auto; min-height: 0; }
  @media (max-width: 900px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; }
    .left { height: 70vh; }
    .right { overflow: visible; }
  }
  .scope { background: var(--scope); position: relative; flex: 1; min-height: 0; }
  #morph { width: 100%; height: 100%; display: block; }
  .info { position: absolute; left: 10px; top: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .info b { color: var(--text); font-weight: 600; }
  .hover { position: absolute; right: 10px; top: 8px; font-size: 12px; background: #000a; padding: 4px 8px; border-radius: 4px; display: none; }
  .legend { display: flex; align-items: center; gap: 8px; padding: 8px 12px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .bar { width: 160px; height: 8px; border-radius: 4px; }
  .right { display: flex; flex-direction: column; min-width: 0; }
  #rows { padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }
  .row { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 4px; cursor: pointer; }
  .row.sel { border-color: var(--accent); }
  .row .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .row .label { font-weight: 600; }
  .row .stats { color: var(--muted); font-size: 12px; }
  .row .stats .hl { color: var(--accent); }
  .row .x { margin-left: auto; color: var(--muted); border: none; background: none; cursor: pointer; font-size: 14px; }
  .row .read { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .row .read span i { display: inline-block; width: 9px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  .cv { position: relative; width: 100%; }
  .cv canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .editor { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 16px; }
  .ctl { display: flex; flex-direction: column; gap: 2px; }
  .ctl label { color: var(--muted); font-size: 11.5px; display: flex; justify-content: space-between; }
  .ctl label output { color: var(--text); font-variant-numeric: tabular-nums; }
  .ctl.changed label { color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select, input[type=number] { background: var(--chip); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
  .actions { display: flex; gap: 8px; align-items: center; padding: 0 12px 10px; flex-wrap: wrap; }
  button.go { background: var(--accent); color: #111; border: none; padding: 7px 14px; border-radius: 6px; font-weight: 650; cursor: pointer; }
  button.plain { background: var(--chip); color: var(--text); border: 1px solid var(--line); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .status { color: var(--muted); font-size: 12px; }
  details { grid-column: 1 / -1; }
  details summary { cursor: pointer; color: var(--muted); }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 16px; margin-top: 8px; }
  footer { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  footer input[type=range] { flex: 1; }
  #tread { font-variant-numeric: tabular-nums; min-width: 92px; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Neuron lab</h1>
  <span class="sub" id="sub">human layer 2/3 pyramidal cell, v0</span>
  <div class="tabs" id="tabs"></div>
</header>
<div class="question" id="question"></div>
<main>
  <section class="left">
    <div class="scope">
      <svg id="morph"></svg>
      <div class="info" id="info"></div>
      <div class="hover" id="hover"></div>
    </div>
    <div class="legend">
      <span>voltage</span><canvas class="bar" id="bar" width="160" height="8"></canvas>
      <span>−80</span><span style="margin-left:auto">+30 mV</span>
      <span>· dots: synapses activated · glow: spike / dCaAP</span>
    </div>
  </section>
  <section class="right">
    <div id="rows"></div>
    <div class="editor" id="editor"></div>
    <div class="actions">
      <button class="go" id="add">Add run with these settings</button>
      <button class="plain" id="reset">Reset to the selected run</button>
      <span class="status" id="status"></span>
    </div>
  </section>
</main>
<footer>
  <button class="plain" id="play">▶ play</button>
  <input type="range" id="time" min="0" max="100" step="0.5" value="0">
  <span id="tread">t = 0.0 ms</span>
  <label class="status">speed <select id="speed"></select> ms per second</label>
</footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
const S = { meta: null, sc: null, runs: [], sel: 0, t: 0, playing: false, last: 0 };
const SPEEDS = [2, 5, 10, 20, 50, 100, 200, 500];
const STOPS = [[-80, [11, 27, 58]], [-70, [23, 61, 107]], [-55, [31, 122, 140]], [-40, [63, 191, 159]],
               [-20, [201, 226, 101]], [0, [255, 179, 71]], [30, [255, 79, 94]]];
const TRACE_COLORS = { soma: "#e9ecef", zone: "#ffa94d", trunk: "#f783ac", "b1.d": "#4dabf7", "b1.m": "#74c0fc",
  "b1.p": "#a5d8ff", "b2.d": "#69db7c", "b2.m": "#8ce99a", "b2.p": "#b2f2bb", "t1.d": "#da77f2", "t1.m": "#e599f7" };

function vrgb(v) {
  if (v <= STOPS[0][0]) return STOPS[0][1];
  for (let i = 1; i < STOPS.length; i++) {
    if (v <= STOPS[i][0]) {
      const [a, ca] = STOPS[i - 1], [b, cb] = STOPS[i], f = (v - a) / (b - a);
      return ca.map((x, j) => Math.round(x + f * (cb[j] - x)));
    }
  }
  return STOPS[STOPS.length - 1][1];
}
const vcol = v => { const c = vrgb(v); return `rgb(${c[0]},${c[1]},${c[2]})`; };

// ---------- geometry: each compartment as a polyline segment, in um, soma at (0, 0) ----------
function geometry(morph) {
  const g = {}, rad = d => d * Math.PI / 180;
  const chain = (names, x, y, ang, bend) => {
    names.forEach((n, i) => {
      const m = morph.find(c => c.name === n), a = rad(ang + i * bend);
      const x2 = x + Math.sin(a) * m.L, y2 = y - Math.cos(a) * m.L;
      g[n] = { x1: x, y1: y, x2, y2, d: m.d }; x = x2; y = y2;
    });
  };
  g.soma = { soma: true };
  chain(["trunk", "zone"], 0, -18, 0, 0);
  chain(["t1.p", "t1.m", "t1.d"], 0, -268, -28, -12);
  chain(["t2.p", "t2.m", "t2.d"], 0, -268, 28, 12);
  chain(["b1.p", "b1.m", "b1.d"], -9, 10, -140, -14);
  chain(["b2.p", "b2.m", "b2.d"], 9, 10, 140, 14);
  return g;
}
const BOUNDS = { x0: -200, x1: 200, y0: -440, y1: 175 };

// ---------- the morphology view ----------
function drawMorph() {
  const svg = $("morph"), W = svg.clientWidth, H = svg.clientHeight;
  const run = S.runs[S.sel];
  if (!S.meta || !W) return;
  const names = S.meta.morphology.map(m => m.name);
  const net = S.sc.network ? S.sc.network : 0;
  const nCells = net ? 2 * net : 1;
  const res = run && run.res;
  const k = res ? Math.max(0, Math.min(res.t.length - 1, Math.round(S.t / (res.t[1] - res.t[0]) - 0.5))) : 0;
  let html = "";
  const places = [];
  for (let c = 0; c < nCells; c++) {
    let cx, cy, s;
    if (!net) {
      s = Math.min(W / (BOUNDS.x1 - BOUNDS.x0), H / (BOUNDS.y1 - BOUNDS.y0)) * 0.92;
      cx = W / 2; cy = H / 2 - (BOUNDS.y0 + BOUNDS.y1) / 2 * s;
    } else {
      const layer = Math.floor(c / 2), col = c % 2, rowH = (H - 70) / net;
      s = Math.min(W / 2 / (BOUNDS.x1 - BOUNDS.x0), rowH / (BOUNDS.y1 - BOUNDS.y0)) * 0.9;
      cx = W * (col ? 0.72 : 0.28); cy = H - 55 - (layer + 0.5) * rowH - (BOUNDS.y0 + BOUNDS.y1) / 2 * s;
    }
    places.push({ cx, cy, s });
  }
  const G = geometry(S.meta.morphology);
  const P = (c, x, y) => [places[c].cx + x * places[c].s, places[c].cy + y * places[c].s];
  // edges (networks)
  if (net && res) {
    const seen = new Set();                           // one curve per (source, target, branch), to its middle segment
    for (const [src, dst, comp, n, delay] of res.edges) {
      const br = names[comp].slice(0, 2), key = `${src}-${dst}-${br}`;
      if (seen.has(key)) continue;
      seen.add(key);
      const [x1, y1] = P(src, 0, 0), seg = G[br + ".m"], [x2, y2] = P(dst, seg.x2, seg.y2);
      const fb = names[comp].startsWith("t");
      const mx = (x1 + x2) / 2 + (fb ? 40 : -40), my = (y1 + y2) / 2;
      html += `<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" fill="none" stroke="${fb ? "#da77f2" : "#4dabf7"}" stroke-opacity=".22" stroke-width="1.2"/>`;
      for (const ts of res.spikes[src]) {
        const f = (S.t - ts) / delay;
        if (f >= 0 && f <= 1) {
          const qx = (1 - f) * (1 - f) * x1 + 2 * (1 - f) * f * mx + f * f * x2;
          const qy = (1 - f) * (1 - f) * y1 + 2 * (1 - f) * f * my + f * f * y2;
          html += `<circle cx="${qx}" cy="${qy}" r="3.5" fill="${fb ? "#da77f2" : "#4dabf7"}"/>`;
        }
      }
    }
  }
  for (let c = 0; c < nCells; c++) {
    const V = res ? res.V[c] : null, sc = places[c].s;
    const volt = i => V ? V[i][k] : -70;
    // axon and a travelling spike
    const [ax, ay] = P(c, 0, 10), [bx, by] = P(c, 0, 70);
    html += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#3a4252" stroke-width="${Math.max(1, 2 * sc)}"/>`;
    if (res) for (const ts of res.spikes[c]) {
      const f = (S.t - ts) / 2.0;
      if (f >= 0 && f <= 1) html += `<circle cx="${ax}" cy="${ay + f * (by - ay)}" r="${Math.max(2, 4 * sc)}" fill="#fff"/>`;
    }
    for (const n of names) {
      if (n === "soma") continue;
      const seg = G[n], i = names.indexOf(n);
      const [x1, y1] = P(c, seg.x1, seg.y1), [x2, y2] = P(c, seg.x2, seg.y2);
      const w = Math.max(1.5, seg.d * 5 * sc);
      let glow = "";
      if (n === "zone" && res && res.dcaap[c].some(([t0, K]) => S.t >= t0 && S.t < t0 + 21)) {
        const K = res.dcaap[c].filter(([t0]) => S.t >= t0 && S.t < t0 + 21).slice(-1)[0][1];
        glow = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffa94d" stroke-opacity="${0.05 + 0.7 * K}" stroke-width="${w + 10 * sc + 4}" stroke-linecap="round"/>`;
      }
      html += glow + `<line data-c="${c}" data-n="${n}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${vcol(volt(i))}" stroke-width="${w}" stroke-linecap="round"/>`;
    }
    const [s1x, s1y] = P(c, -16, 10), [s2x, s2y] = P(c, 16, 10), [s3x, s3y] = P(c, 0, -20);
    const spiking = res && res.spikes[c].some(ts => S.t >= ts && S.t < ts + 1.5);
    if (spiking) html += `<circle cx="${P(c, 0, -2)[0]}" cy="${P(c, 0, -2)[1]}" r="${30 * sc + 6}" fill="#fff" fill-opacity=".18"/>`;
    html += `<polygon data-c="${c}" data-n="soma" points="${s1x},${s1y} ${s2x},${s2y} ${s3x},${s3y}" fill="${vcol(volt(0))}" stroke="${spiking ? "#fff" : "#000"}" stroke-width="1.5"/>`;
    if (net) {
      const [lx, ly] = P(c, -150, 160);
      html += `<text x="${lx}" y="${ly}" fill="#8a94a6" font-size="11">L${Math.floor(c / 2) + 1}${"ab"[c % 2]}</text>`;
    } else {
      for (const [n, dx, dy] of [["t1.d", -26, -6], ["t2.d", 8, -6], ["b1.d", -30, 16], ["b2.d", 6, 16], ["zone", 10, 4], ["trunk", 10, 4]]) {
        const seg = G[n], [x, y] = P(c, n === "zone" || n === "trunk" ? (seg.x1 + seg.x2) / 2 : seg.x2, n === "zone" || n === "trunk" ? (seg.y1 + seg.y2) / 2 : seg.y2);
        html += `<text x="${x + dx}" y="${y + dy}" fill="#8a94a6" font-size="11">${n.replace(".d", "")}</text>`;
      }
    }
  }
  // synapses activated in the last 3 ms
  if (res) {
    let h = 0;
    for (const [ts, c, comp, n] of res.syn) {
      h++;
      const age = S.t - ts;
      if (age < 0 || age > 3 || c >= nCells) continue;
      const nm = names[comp], seg = G[nm];
      let x, y;
      if (nm === "soma") { [x, y] = P(c, 0, 0); }
      else {
        const f = 0.2 + 0.6 * ((h * 0.618) % 1), off = (((h * 0.37) % 1) - 0.5) * 10;
        const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1, L = Math.hypot(dx, dy);
        [x, y] = P(c, seg.x1 + f * dx - dy / L * off, seg.y1 + f * dy + dx / L * off);
      }
      html += `<circle cx="${x}" cy="${y}" r="${Math.max(1.8, 1.4 * Math.sqrt(n) * places[c].s * 3)}" fill="#ffe066" fill-opacity="${1 - age / 3}"/>`;
    }
  }
  if (net && res) {                                   // the input fibres
    const fib = [["fibre 1", W * 0.12, "b1"], ["fibre 2", W * 0.88, "b2"]];
    for (const [lab, x, br] of fib) {
      const on = res.syn.some(([ts, c, cc]) => c < 2 && names[cc].startsWith(br) && S.t - ts >= 0 && S.t - ts < 2);
      html += `<circle cx="${x}" cy="${H - 22}" r="7" fill="${on ? "#ffe066" : "#2a3140"}"/><text x="${x + 12}" y="${H - 18}" fill="#8a94a6" font-size="11">${lab}</text>`;
    }
  }
  svg.innerHTML = html;
  const r = run ? run.label : "";
  $("info").innerHTML = run ? `<b>${r}</b> · t = ${S.t.toFixed(1)} ms` + (res ? ` · simulated in ${res.seconds} s` : " · simulating…") : "";
}

// ---------- the run rows ----------
function stats(res, sc) {
  if (!res) return "simulating…";
  if (sc.network) {
    return res.spikes.map((s, c) => `L${Math.floor(c / 2) + 1}${"ab"[c % 2]} <span class="hl">${s.length}</span>`).join(" · ")
      + ` spikes · dCaAPs ${res.dcaap.reduce((a, d) => a + d.length, 0)}`;
  }
  const sp = res.spikes[0], ev = [];
  let last = -1e9;
  for (const t of sp) { if (t - last > 16) ev.push(1); else ev[ev.length - 1]++; last = t; }
  const bursts = ev.filter(e => e >= 2).length;
  const d = res.dcaap[0].map(([t, K]) => `K ${K.toFixed(2)} @${t.toFixed(0)}`).join(", ");
  const peak = Math.max(...res.V[0][0]);
  return `<span class="hl">${sp.length}</span> spikes (${ev.length} events, ${bursts} bursts) · dCaAP: ${d || "none"} · soma peak ${peak.toFixed(1)} mV`;
}

function rowHeight(sc) { return sc.network ? 26 * 2 * sc.network + 12 : 120; }

function drawBase(row) {
  const cv = row.base, res = row.res, sc = S.sc;
  const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; row.over.width = W * dpr; row.over.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  g.fillStyle = "#0a0d13"; g.fillRect(0, 0, W, H);
  if (!res) return;
  const T = sc.T, X = t => t / T * W;
  if (sc.network) {
    const n = res.spikes.length, lane = H / n;
    for (let c = 0; c < n; c++) {
      const y0 = (n - 1 - c) * lane, Y = v => y0 + lane - 3 - (v + 80) / 120 * (lane - 6);
      g.fillStyle = "#8a94a6"; g.font = "10px system-ui"; g.fillText(`L${Math.floor(c / 2) + 1}${"ab"[c % 2]}`, 3, y0 + 11);
      for (const [t0, K] of res.dcaap[c]) { g.fillStyle = `rgba(255,169,77,${0.04 + 0.36 * K})`; g.fillRect(X(t0), y0, X(21), lane); }
      g.strokeStyle = "#e9ecef"; g.lineWidth = 1; g.beginPath();
      res.V[c][0].forEach((v, i) => { const x = X(res.t[i]), y = Y(v); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
    }
    return;
  }
  const Y = v => H - 4 - (v + 85) / 120 * (H - 8);
  g.strokeStyle = "#232a36"; g.setLineDash([3, 4]);
  for (const v of [-70, -50, 0]) { g.beginPath(); g.moveTo(0, Y(v)); g.lineTo(W, Y(v)); g.stroke(); }
  g.setLineDash([]); g.fillStyle = "#4a5466"; g.font = "10px system-ui";
  g.fillText("−70", W - 22, Y(-70) - 2); g.fillText("0 mV", W - 30, Y(0) - 2);
  for (const [t0, K] of res.dcaap[0]) {             // a dCaAP's band: its opacity is its strength K
    g.fillStyle = `rgba(255,169,77,${0.04 + 0.36 * K})`; g.fillRect(X(t0), 0, X(21), H);
    g.fillStyle = "#ffa94d"; g.font = "10px system-ui"; g.fillText(`dCaAP K ${K.toFixed(2)}`, X(t0) + 3, 16);
  }
  const names = S.meta.morphology.map(m => m.name);
  for (const n of [...sc.traces].reverse()) {
    const i = names.indexOf(n);
    g.strokeStyle = TRACE_COLORS[n] || "#ccc"; g.lineWidth = n === "soma" ? 1.6 : 1.1; g.beginPath();
    res.V[0][i].forEach((v, j) => { const x = X(res.t[j]), y = Y(v); j ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
  }
  g.fillStyle = "#fff";
  for (const t of res.spikes[0]) g.fillRect(X(t) - 0.5, 0, 1.2, 6);
  const synT = [...new Set(res.syn.map(s => s[0]))];
  g.fillStyle = "#ffe066";
  for (const t of synT) g.fillRect(X(t) - 0.5, H - 4, 1.2, 4);
}

function drawCursors() {
  const T = S.sc ? S.sc.T : 1;
  for (const row of S.runs) {
    const cv = row.over, W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const x = S.t / T * W; g.strokeStyle = "#ffa94d"; g.lineWidth = 1; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
    if (row.res && !S.sc.network) {
      const res = row.res, names = S.meta.morphology.map(m => m.name);
      const k = Math.max(0, Math.min(res.t.length - 1, Math.round(S.t / (res.t[1] - res.t[0]) - 0.5)));
      row.read.innerHTML = S.sc.traces.map(n => `<span><i style="background:${TRACE_COLORS[n] || "#ccc"}"></i>${n} ${res.V[0][names.indexOf(n)][k].toFixed(1)} mV</span>`).join("");
    }
  }
}

function makeRow(label, controls, params) {
  const el = document.createElement("div"); el.className = "row";
  el.innerHTML = `<div class="head"><span class="label"></span><span class="stats">simulating…</span><button class="x" title="remove">✕</button></div>
    <div class="read"></div><div class="cv" style="height:${rowHeight(S.sc)}px"><canvas></canvas><canvas></canvas></div>`;
  el.querySelector(".label").textContent = label;
  const [base, over] = el.querySelectorAll("canvas");
  const row = { label, controls, params, res: null, el, base, over, read: el.querySelector(".read") };
  el.addEventListener("click", e => {
    if (e.target.classList.contains("x")) {
      const i = S.runs.indexOf(row); S.runs.splice(i, 1); el.remove();
      S.sel = Math.min(S.sel, S.runs.length - 1); markSel(); drawMorph(); return;
    }
    S.sel = S.runs.indexOf(row); markSel(); loadEditor(row); drawMorph();
  });
  over.addEventListener("mousemove", e => {
    if (S.playing) return;
    const r = over.getBoundingClientRect(); setTime((e.clientX - r.left) / r.width * S.sc.T);
  });
  $("rows").appendChild(el); S.runs.push(row);
  return row;
}

async function simulateRow(row) {
  const sc = S.sc;
  try {
    const r = await fetch("/api/run", { method: "POST", body: JSON.stringify({ scenario: sc.key, controls: row.controls, params: row.params }) });
    const res = await r.json();
    if (S.sc !== sc) return;
    if (res.error) { row.el.querySelector(".stats").innerHTML = `<span class="err">${res.error}</span>`; return; }
    row.res = res; row.el.querySelector(".stats").innerHTML = stats(res, sc);
    drawBase(row); drawCursors(); drawMorph();
  } catch (e) { row.el.querySelector(".stats").innerHTML = `<span class="err">${e}</span>`; }
}

function markSel() { S.runs.forEach((r, i) => r.el.classList.toggle("sel", i === S.sel)); }

// ---------- the editor: one change at a time, then add it as a run ----------
function loadEditor(row) {
  const sc = S.sc, ed = $("editor"); ed.innerHTML = "";
  const base = sc.runs[0][1];
  for (const c of sc.controls) {
    const v = row && c.name in row.controls ? row.controls[c.name] : (c.name in base ? base[c.name] : c.default);
    const d = document.createElement("div"); d.className = "ctl"; d.dataset.name = c.name;
    if (c.kind === "range") {
      d.innerHTML = `<label>${c.label}<output>${v}</output></label><input type="range" min="${c.lo}" max="${c.hi}" step="${c.step}" value="${v}">`;
      const inp = d.querySelector("input"), out = d.querySelector("output");
      inp.addEventListener("input", () => { out.textContent = inp.value; markChanged(); });
    } else if (c.kind === "toggle") {
      d.innerHTML = `<label>${c.label}<input type="checkbox" ${+v ? "checked" : ""}></label>`;
      d.querySelector("input").addEventListener("change", markChanged);
    } else {
      d.innerHTML = `<label>${c.label}</label><select>${c.options.map(o => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
      d.querySelector("select").addEventListener("change", markChanged);
    }
    ed.appendChild(d);
  }
  const det = document.createElement("details");
  det.innerHTML = `<summary>cell parameters (apply to the next run you add)</summary><div class="pgrid"></div>`;
  const pg = det.querySelector(".pgrid");
  for (const p of S.meta.editable) {
    const v = row && p.name in row.params ? row.params[p.name] : S.meta.params[p.name];
    const d = document.createElement("div"); d.className = "ctl"; d.dataset.param = p.name;
    d.innerHTML = `<label>${p.label}</label><input type="number" min="${p.lo}" max="${p.hi}" step="${p.step}" value="${+(+v).toFixed(4)}">`;
    d.querySelector("input").addEventListener("input", markChanged);
    pg.appendChild(d);
  }
  if (row && Object.keys(row.params).length) det.open = true;
  ed.appendChild(det);
  S.editorBase = row ? { controls: { ...base, ...row.controls }, params: row.params } : { controls: base, params: {} };
  markChanged();
}

function readEditor() {
  const controls = {}, params = {};
  for (const d of $("editor").querySelectorAll(".ctl[data-name]")) {
    const c = S.sc.controls.find(x => x.name === d.dataset.name);
    if (c.kind === "range") controls[c.name] = +d.querySelector("input").value;
    else if (c.kind === "toggle") controls[c.name] = d.querySelector("input").checked ? 1 : 0;
    else controls[c.name] = d.querySelector("select").value;
  }
  for (const d of $("editor").querySelectorAll(".ctl[data-param]")) {
    const v = +d.querySelector("input").value;
    if (Math.abs(v - S.meta.params[d.dataset.param]) > 1e-9) params[d.dataset.param] = v;
  }
  return { controls, params };
}

function markChanged() {
  const { controls, params } = readEditor(), b = S.editorBase || { controls: {}, params: {} };
  for (const d of $("editor").querySelectorAll(".ctl[data-name]")) d.classList.toggle("changed", controls[d.dataset.name] != b.controls[d.dataset.name]);
  for (const d of $("editor").querySelectorAll(".ctl[data-param]")) d.classList.toggle("changed", d.dataset.param in params);
}

function describe(controls, params) {
  // "the run it came from -> what changed": one intervention against a known run
  const sc = S.sc, from = S.runs[S.sel], b = S.editorBase || { controls: {}, params: {} }, parts = [];
  for (const c of sc.controls) {
    const v = controls[c.name];
    if (v != b.controls[c.name]) parts.push(c.kind === "toggle" ? `${c.label} ${+v ? "on" : "off"}` : `${c.label} ${v}`);
  }
  for (const k of new Set([...Object.keys(params), ...Object.keys(b.params)]))
    if (params[k] !== b.params[k]) parts.push(`${k} ${k in params ? params[k] : S.meta.params[k]}`);
  return `${from ? from.label : "run"} → ${parts.length ? parts.join(" · ") : "same settings"}`;
}

// ---------- time ----------
function setTime(t) {
  S.t = Math.max(0, Math.min(S.sc.T, t));
  $("time").value = S.t; $("tread").textContent = `t = ${S.t.toFixed(1)} ms`;
  drawCursors(); drawMorph();
}
function tick(now) {
  if (S.playing) {
    const dt = (now - S.last) / 1000; S.last = now;
    let t = S.t + dt * +$("speed").value;
    if (t >= S.sc.T) { t = S.sc.T; S.playing = false; $("play").textContent = "▶ play"; }
    setTime(t);
  }
  requestAnimationFrame(tick);
}

function selectScenario(key) {
  S.sc = S.meta.scenarios.find(s => s.key === key);
  for (const b of $("tabs").children) b.classList.toggle("on", b.dataset.key === key);
  $("question").textContent = S.sc.question;
  $("rows").innerHTML = ""; S.runs = []; S.sel = 0; S.playing = false; $("play").textContent = "▶ play";
  $("time").max = S.sc.T;
  const want = S.sc.T / 6, sp = SPEEDS.reduce((a, b) => Math.abs(b - want) < Math.abs(a - want) ? b : a);
  $("speed").value = sp;
  const rows = S.sc.runs.map(([label, controls]) => makeRow(label, { ...defaults(S.sc), ...controls }, {}));
  markSel(); loadEditor(rows[0]); setTime(0);
  rows.forEach(simulateRow);
}
function defaults(sc) { const d = {}; for (const c of sc.controls) d[c.name] = c.default; return d; }

async function init() {
  S.meta = await (await fetch("/api/meta")).json();
  const cal = S.meta.calibration;
  $("sub").textContent = `human layer 2/3 pyramidal cell, v0 · 15 compartments · dCaAP w ${cal.dca_w} pA, threshold current ${cal.zone_rheobase} pA`;
  for (const s of S.meta.scenarios) {
    const b = document.createElement("button"); b.className = "tab"; b.textContent = s.title; b.dataset.key = s.key;
    b.onclick = () => selectScenario(s.key); $("tabs").appendChild(b);
  }
  $("speed").innerHTML = SPEEDS.map(v => `<option value="${v}">${v}</option>`).join("");
  const bar = $("bar").getContext("2d");
  for (let x = 0; x < 160; x++) { bar.fillStyle = vcol(-80 + x / 159 * 110); bar.fillRect(x, 0, 1, 8); }
  $("play").onclick = () => {
    if (!S.playing && S.t >= S.sc.T) setTime(0);
    S.playing = !S.playing; S.last = performance.now(); $("play").textContent = S.playing ? "❚❚ pause" : "▶ play";
  };
  $("time").oninput = e => setTime(+e.target.value);
  $("add").onclick = () => {
    const { controls, params } = readEditor();
    const row = makeRow(describe(controls, params), controls, params);
    S.sel = S.runs.length - 1; markSel(); S.editorBase = { controls, params }; markChanged(); simulateRow(row);
  };
  $("reset").onclick = () => loadEditor(S.runs[S.sel]);
  $("morph").addEventListener("mousemove", e => {
    const n = e.target.dataset && e.target.dataset.n, h = $("hover"), run = S.runs[S.sel];
    if (!n || !run || !run.res) { h.style.display = "none"; return; }
    const c = +e.target.dataset.c, i = S.meta.morphology.findIndex(m => m.name === n), res = run.res;
    const k = Math.max(0, Math.min(res.t.length - 1, Math.round(S.t / (res.t[1] - res.t[0]) - 0.5)));
    h.style.display = "block";
    h.textContent = `${S.sc.network ? `L${Math.floor(c / 2) + 1}${"ab"[c % 2]} ` : ""}${n}: ${res.V[c][i][k].toFixed(1)} mV`;
  });
  window.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.code === "Space") { e.preventDefault(); $("play").click(); }
    if (e.code === "ArrowRight") setTime(S.t + 0.5);
    if (e.code === "ArrowLeft") setTime(S.t - 0.5);
  });
  window.addEventListener("resize", () => { S.runs.forEach(drawBase); drawCursors(); drawMorph(); });
  selectScenario(S.meta.scenarios[0].key);
  requestAnimationFrame(tick);
}
init();
</script>
</body>
</html>
